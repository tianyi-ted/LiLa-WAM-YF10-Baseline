# Deployment experiment; shares the existing checkpoint and safety limits.
# Switch modes in this config, not in the checkpoint training config.
hardware:
  arm_side: right
  camera_name: chest_camera
  collector_config_path: ../edulite_a3_collect/config.master_slave.yaml
model:
  checkpoint_path: ../../checkpoints_vla/edulite_single_multitask/sft_2026-10-31_17-48-32/checkpoint_epoch_50.pt
  config_path: ../../checkpoints_vla/edulite_single_multitask/sft_2026-10-31_17-48-32/config.yaml
  device: cuda
  dtype: bfloat16
  instruction: pick up the red block and place it on top of the blue block
  norm_stats_path: ../../utils/stat-edulite-single-multitask.json
  task_name: place_red_block_on_blue_block
runtime:
  action_rate_hz: 30.0
  camera_max_age_s: 0.25
  control_rate_hz: 100.0
  diagnostics:
    enabled: true
  joint_bspline:
    control_points: 8
    degree: 3
    enabled: true
    fallback_if_worse: true
    history_actions: 2
    history_weight: 4.0
    method: weighted_history
  max_episode_s: 60.0
  prefetch_threshold_actions: 8
  require_preview_before_execute: true
  start_delay_s: 3.0
  chunk_update_mode: latest_ready
safety:
  clamp_to_training_range: true
  feedback_timeout_s: 0.2
  filter_omega: 10.0
  follow_error_cycles: 20
  gripper_command_deadband_norm: 0.005
  gripper_filter_alpha: 0.7
  gripper_max_target_rate_norm_s: 2.0
  joint_limit_margin_rad: 0.03
  max_acceleration_rad_s2:
  - 1.2
  - 1.2
  - 1.2
  - 1.8
  - 1.8
  - 1.8
  max_follow_error_rad: 0.3
  max_target_step_rad:
  - 0.08
  - 0.08
  - 0.08
  - 0.1
  - 0.1
  - 0.1
  max_velocity_rad_s:
  - 0.35
  - 0.35
  - 0.35
  - 0.45
  - 0.45
  - 0.45
  model_command_timeout_s: 1.0
  raw_gripper_tolerance: 0.2
  raw_joint_limit_tolerance_rad: 0.25
  startup_feedback_timeout_s: 2.0
visualization:
  enabled: true
  output_root: ./inference_outputs_multitask_latest
  save_video: true
  video_fps: 30.0

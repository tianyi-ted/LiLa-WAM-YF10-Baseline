# Native single-arm LiLa-WAM deployment. Fill the checkpoint path after training.
# Relative paths are resolved against this file; never use the old 14D checkpoint.
model:
  config_path: ../../checkpoints_vla/edulite_single_chest_clean/sft_2026-09-27_19-00-44/config.yaml
  checkpoint_path: ../../checkpoints_vla/edulite_single_chest_clean/sft_2026-09-27_19-00-44/checkpoint_epoch_80.pt
  norm_stats_path: ../../utils/stat-edulite-single-chest-clean.json
  device: cuda
  dtype: bfloat16
  task_name: place_red_block_into_box
  instruction: "pick up the red block and place it in the box"

hardware:
  collector_config_path: ../edulite_a3_collect/config.master_slave.yaml
  arm_side: right
  # Must match dataset.camera_names[0] in the checkpoint's training config.
  camera_name: chest_camera

runtime:
  action_rate_hz: 30.0
  control_rate_hz: 100.0
  prefetch_threshold_actions: 8
  start_delay_s: 3.0
  max_episode_s: 60.0
  camera_max_age_s: 0.25
  require_preview_before_execute: true
  joint_bspline:
    # Disabled for this deployment: execute model action chunks directly.
    # The smoother remains in the code for optional experiments, but is not
    # applied to preview or runtime actions when this flag is false.
    enabled: false
    degree: 3
    history_actions: 2
    control_points: 8
    history_weight: 4.0
    fallback_if_worse: true

visualization:
  enabled: true
  output_root: ./inference_outputs_single
  save_video: true
  video_fps: 30.0

safety:
  clamp_to_training_range: true
  joint_limit_margin_rad: 0.15
  filter_omega: 10.0
  max_velocity_rad_s: [0.35, 0.35, 0.35, 0.45, 0.45, 0.45]
  max_acceleration_rad_s2: [1.2, 1.2, 1.2, 1.8, 1.8, 1.8]
  # Faster L7 response; torque/current and force-stop protections are unchanged.
  gripper_filter_alpha: 0.70
  gripper_max_target_rate_norm_s: 2.00
  gripper_command_deadband_norm: 0.005
  max_target_step_rad: [0.08, 0.08, 0.08, 0.10, 0.10, 0.10]
  max_follow_error_rad: 0.30
  follow_error_cycles: 20
  feedback_timeout_s: 0.20
  startup_feedback_timeout_s: 2.0
  model_command_timeout_s: 1.0
  raw_joint_limit_tolerance_rad: 0.25
  raw_gripper_tolerance: 0.20
